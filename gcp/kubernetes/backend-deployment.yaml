# Backend API Deployment for Electrical Estimation System
# Express.js API server with PostgreSQL integration

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: electrical-estimation
  labels:
    app: backend-api
    component: api-server
    project: electrical-estimation
    environment: production
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
        component: api-server
        project: electrical-estimation
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: n8n
      automountServiceAccountToken: true
      
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      
      # Init container to run database migrations
      initContainers:
      - name: db-migrate
        image: gcr.io/PROJECT_ID/electrical-backend:latest
        command:
        - sh
        - -c
        - |
          echo "Running database migrations..."
          npm run migrate
          echo "Migrations completed"
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: DATABASE_URL
        - name: NODE_ENV
          value: "production"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: var-tmp
          mountPath: /var/tmp

      containers:
      - name: backend-api
        image: gcr.io/PROJECT_ID/electrical-backend:latest
        imagePullPolicy: IfNotPresent
        
        ports:
        - name: http
          containerPort: 3001
          protocol: TCP
        
        # Environment variables
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: REDIS_URL
        - name: N8N_WEBHOOK_URL
          value: "http://n8n.electrical-estimation.svc.cluster.local/webhook"
        - name: FRONTEND_URL
          value: "https://electrical-estimation.example.com"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: JWT_SECRET
        - name: PROJECT_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['project_id']
        
        # Resource limits and requests
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
            ephemeral-storage: "500Mi"
          limits:
            memory: "1Gi"
            cpu: "500m"
            ephemeral-storage: "1Gi"
        
        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        
        # Probes
        startupProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
          successThreshold: 1
        
        livenessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        
        readinessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        
        # Volume mounts
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: var-tmp
          mountPath: /var/tmp
        - name: logs
          mountPath: /app/logs
      
      # Volumes
      volumes:
      - name: tmp
        emptyDir: {}
      - name: var-tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
      
      # Node affinity for optimal placement
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - backend-api
              topologyKey: kubernetes.io/hostname
      
      # Graceful termination
      terminationGracePeriodSeconds: 30

---
# Service for Backend API
apiVersion: v1
kind: Service
metadata:
  name: backend-api
  namespace: electrical-estimation
  labels:
    app: backend-api
    component: api-server
    project: electrical-estimation
spec:
  selector:
    app: backend-api
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  type: ClusterIP

---
# Horizontal Pod Autoscaler for Backend API
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-api-hpa
  namespace: electrical-estimation
  labels:
    app: backend-api
    project: electrical-estimation
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 4
        periodSeconds: 60
      selectPolicy: Max

---
# Pod Disruption Budget for Backend API
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-api-pdb
  namespace: electrical-estimation
  labels:
    app: backend-api
    project: electrical-estimation
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: backend-api

---
# Secret for Backend API configuration
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: electrical-estimation
  labels:
    app: backend-api
    project: electrical-estimation
type: Opaque
data:
  # Base64 encoded values - replace with actual values
  DATABASE_URL: cG9zdGdyZXNxbDovL24ubi11c2VyOnBhc3N3b3JkQGhvc3Q6NTQzMi9kYg==
  REDIS_URL: cmVkaXM6Ly9yZWRpcy1ob3N0OjYzNzk=
  JWT_SECRET: eW91ci1qd3Qtc2VjcmV0LWhlcmU=

---
# ConfigMap for Backend API configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: electrical-estimation
  labels:
    app: backend-api
    project: electrical-estimation
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  API_VERSION: "v1"
  CORS_ORIGIN: "https://electrical-estimation.example.com"
  RATE_LIMIT_WINDOW: "900000"  # 15 minutes
  RATE_LIMIT_MAX: "100"
  DATABASE_POOL_SIZE: "20"
  DATABASE_TIMEOUT: "30000"