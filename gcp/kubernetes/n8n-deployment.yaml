# N8N Deployment for GKE Autopilot
# Production-ready deployment with electrical estimation workflows

apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: electrical-estimation
  labels:
    app: n8n
    component: workflow-engine
    project: electrical-estimation
    environment: production
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
        component: workflow-engine
        project: electrical-estimation
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5678"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: n8n
      automountServiceAccountToken: true
      
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      
      # Init container to wait for database
      initContainers:
      - name: wait-for-db
        image: postgres:15-alpine
        command:
        - sh
        - -c
        - |
          until pg_isready -h $DB_POSTGRESDB_HOST -p $DB_POSTGRESDB_PORT -U $DB_POSTGRESDB_USER; do
            echo "Waiting for database..."
            sleep 2
          done
          echo "Database is ready!"
        env:
        - name: DB_POSTGRESDB_HOST
          valueFrom:
            configMapKeyRef:
              name: n8n-config
              key: DB_POSTGRESDB_HOST
        - name: DB_POSTGRESDB_PORT
          valueFrom:
            configMapKeyRef:
              name: n8n-config
              key: DB_POSTGRESDB_PORT
        - name: DB_POSTGRESDB_USER
          valueFrom:
            configMapKeyRef:
              name: n8n-config
              key: DB_POSTGRESDB_USER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: DB_POSTGRESDB_PASSWORD
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

      containers:
      - name: n8n
        image: n8nio/n8n:1.19.4
        imagePullPolicy: IfNotPresent
        
        ports:
        - name: http
          containerPort: 5678
          protocol: TCP
        
        # Environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: n8n-config
        - secretRef:
            name: n8n-secrets
        
        # Additional environment variables
        env:
        - name: NODE_ENV
          value: "production"
        - name: N8N_SKIP_WEBHOOK_DEREGISTRATION_SHUTDOWN
          value: "true"
        - name: N8N_GRACEFUL_SHUTDOWN_TIMEOUT
          value: "30"
        
        # Resource limits and requests
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
            ephemeral-storage: "1Gi"
          limits:
            memory: "2Gi"
            cpu: "1000m"
            ephemeral-storage: "2Gi"
        
        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        
        # Probes
        startupProbe:
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12
          successThreshold: 1
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        
        # Volume mounts
        volumeMounts:
        - name: n8n-data
          mountPath: /home/node/.n8n
        - name: custom-nodes
          mountPath: /home/node/.n8n/custom
        - name: tmp
          mountPath: /tmp
        - name: var-tmp
          mountPath: /var/tmp
      
      # Volumes
      volumes:
      - name: n8n-data
        persistentVolumeClaim:
          claimName: n8n-data
      - name: custom-nodes
        configMap:
          name: n8n-custom-nodes
          defaultMode: 0755
      - name: tmp
        emptyDir: {}
      - name: var-tmp
        emptyDir: {}
      
      # Node affinity and tolerations for optimal placement
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - n8n
              topologyKey: kubernetes.io/hostname
      
      # Graceful termination
      terminationGracePeriodSeconds: 60

---
# Service for N8N
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: electrical-estimation
  labels:
    app: n8n
    component: workflow-engine
    project: electrical-estimation
  annotations:
    cloud.google.com/load-balancer-type: "External"
spec:
  selector:
    app: n8n
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  type: ClusterIP

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: n8n-hpa
  namespace: electrical-estimation
  labels:
    app: n8n
    project: electrical-estimation
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: n8n
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max

---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: n8n-pdb
  namespace: electrical-estimation
  labels:
    app: n8n
    project: electrical-estimation
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: n8n

---
# Network Policy for N8N
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: n8n-network-policy
  namespace: electrical-estimation
  labels:
    app: n8n
    project: electrical-estimation
spec:
  podSelector:
    matchLabels:
      app: n8n
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: istio-system
    - podSelector:
        matchLabels:
          app: istio-proxy
    ports:
    - protocol: TCP
      port: 5678
  - from:
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 5678
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
  # Allow PostgreSQL connection
  - to: []
    ports:
    - protocol: TCP
      port: 5432
  # Allow Redis connection
  - to: []
    ports:
    - protocol: TCP
      port: 6379
  # Allow HTTPS outbound for webhooks and APIs
  - to: []
    ports:
    - protocol: TCP
      port: 443
  # Allow HTTP outbound for APIs
  - to: []
    ports:
    - protocol: TCP
      port: 80
  # Allow Cloud Run services
  - to: []
    ports:
    - protocol: TCP
      port: 8080