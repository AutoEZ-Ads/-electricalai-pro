# Enhanced Edge Computing Deployment for Electrical Estimation System
# Comprehensive edge infrastructure with IoT management, data sync, and remote site support

---
# Edge Device Management Controller
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-device-manager
  namespace: electrical-estimation
  labels:
    app: edge-device-manager
    tier: edge-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edge-device-manager
  template:
    metadata:
      labels:
        app: edge-device-manager
        tier: edge-management
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: electrical-edge-service
      priorityClassName: high-priority
      containers:
      - name: device-manager
        image: gcr.io/PROJECT_ID/edge-device-manager:latest
        ports:
        - name: http
          containerPort: 8081
        - name: mqtt
          containerPort: 1883
        - name: coap
          containerPort: 5683
        - name: metrics
          containerPort: 9091
        env:
        - name: DEVICE_REGISTRY_ENDPOINT
          value: "https://cloudiot.googleapis.com/v1"
        - name: MQTT_BROKER_URL
          value: "mqtt://edge-mqtt-broker:1883"
        - name: EDGE_DATA_SYNC_INTERVAL
          value: "30s"
        - name: OFFLINE_BUFFER_SIZE
          value: "10000"
        - name: ENABLE_DEVICE_MONITORING
          value: "true"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
        volumeMounts:
        - name: device-cache
          mountPath: /app/cache
        - name: certificates
          mountPath: /app/certs
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: device-cache
        emptyDir:
          sizeLimit: 2Gi
      - name: certificates
        secret:
          secretName: edge-device-certificates
      - name: tmp
        emptyDir:
          sizeLimit: 500Mi

---
# IoT MQTT Broker for device communication
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-mqtt-broker
  namespace: electrical-estimation
  labels:
    app: edge-mqtt-broker
    tier: iot-communication
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-mqtt-broker
  template:
    metadata:
      labels:
        app: edge-mqtt-broker
        tier: iot-communication
    spec:
      containers:
      - name: mqtt-broker
        image: eclipse-mosquitto:2.0
        ports:
        - name: mqtt
          containerPort: 1883
        - name: mqtt-tls
          containerPort: 8883
        - name: websocket
          containerPort: 9001
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        volumeMounts:
        - name: mqtt-config
          mountPath: /mosquitto/config
        - name: mqtt-data
          mountPath: /mosquitto/data
        - name: mqtt-logs
          mountPath: /mosquitto/log
        - name: certificates
          mountPath: /mosquitto/certs
          readOnly: true
      volumes:
      - name: mqtt-config
        configMap:
          name: mqtt-broker-config
      - name: mqtt-data
        persistentVolumeClaim:
          claimName: mqtt-data-pvc
      - name: mqtt-logs
        emptyDir:
          sizeLimit: 1Gi
      - name: certificates
        secret:
          secretName: mqtt-tls-certificates

---
# Edge Data Synchronization Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-data-sync
  namespace: electrical-estimation
  labels:
    app: edge-data-sync
    tier: data-synchronization
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edge-data-sync
  template:
    metadata:
      labels:
        app: edge-data-sync
        tier: data-synchronization
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
    spec:
      serviceAccountName: electrical-edge-service
      containers:
      - name: data-sync
        image: gcr.io/PROJECT_ID/edge-data-sync:latest
        ports:
        - name: http
          containerPort: 8082
        - name: grpc
          containerPort: 9092
        - name: metrics
          containerPort: 9093
        env:
        - name: SYNC_MODE
          value: "bidirectional"
        - name: CONFLICT_RESOLUTION
          value: "latest-wins"
        - name: BATCH_SIZE
          value: "1000"
        - name: SYNC_INTERVAL
          value: "60s"
        - name: OFFLINE_THRESHOLD
          value: "300s"
        - name: ENABLE_COMPRESSION
          value: "true"
        - name: ENABLE_ENCRYPTION
          value: "true"
        - name: CLOUD_ENDPOINT
          value: "https://api.electrical-estimation.com"
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "400m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1002
        volumeMounts:
        - name: sync-buffer
          mountPath: /app/buffer
        - name: sync-logs
          mountPath: /app/logs
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: sync-buffer
        persistentVolumeClaim:
          claimName: sync-buffer-pvc
      - name: sync-logs
        emptyDir:
          sizeLimit: 1Gi
      - name tmp
        emptyDir:
          sizeLimit: 500Mi

---
# Remote Site Configuration Manager
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remote-site-manager
  namespace: electrical-estimation
  labels:
    app: remote-site-manager
    tier: site-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remote-site-manager
  template:
    metadata:
      labels:
        app: remote-site-manager
        tier: site-management
    spec:
      serviceAccountName: electrical-edge-service
      containers:
      - name: site-manager
        image: gcr.io/PROJECT_ID/remote-site-manager:latest
        ports:
        - name: http
          containerPort: 8083
        - name: ssh
          containerPort: 2222
        env:
        - name: SITE_CONFIG_ENDPOINT
          value: "gs://PROJECT_ID-site-configs"
        - name: CONFIG_SYNC_INTERVAL
          value: "300s"
        - name: ENABLE_AUTO_DEPLOYMENT
          value: "true"
        - name: HEALTH_CHECK_INTERVAL
          value: "60s"
        - name: SITE_MONITORING_ENABLED
          value: "true"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1003
        volumeMounts:
        - name: site-configs
          mountPath: /app/configs
        - name: ssh-keys
          mountPath: /app/ssh
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: site-configs
        emptyDir:
          sizeLimit: 1Gi
      - name: ssh-keys
        secret:
          secretName: site-manager-ssh-keys
          defaultMode: 0600
      - name: tmp
        emptyDir:
          sizeLimit: 100Mi

---
# Edge Analytics Engine
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-analytics-engine
  namespace: electrical-estimation
  labels:
    app: edge-analytics-engine
    tier: edge-analytics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edge-analytics-engine
  template:
    metadata:
      labels:
        app: edge-analytics-engine
        tier: edge-analytics
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"
    spec:
      serviceAccountName: electrical-edge-service
      priorityClassName: high-priority
      containers:
      - name: analytics-engine
        image: gcr.io/PROJECT_ID/edge-analytics-engine:latest
        ports:
        - name: http
          containerPort: 8084
        - name: grpc
          containerPort: 9094
        - name: metrics
          containerPort: 9095
        env:
        - name: ANALYTICS_MODE
          value: "real-time"
        - name: PROCESSING_WINDOW
          value: "5m"
        - name: ENABLE_ML_INFERENCE
          value: "true"
        - name: MODEL_UPDATE_INTERVAL
          value: "3600s"
        - name: ANOMALY_DETECTION_ENABLED
          value: "true"
        - name: TIME_SERIES_BUFFER_SIZE
          value: "100000"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
            ephemeral-storage: "2Gi"
          limits:
            memory: "2Gi"
            cpu: "1000m"
            ephemeral-storage: "4Gi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1004
        volumeMounts:
        - name: analytics-cache
          mountPath: /app/cache
        - name: ml-models
          mountPath: /app/models
        - name: analytics-data
          mountPath: /app/data
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: analytics-cache
        emptyDir:
          sizeLimit: 2Gi
      - name: ml-models
        persistentVolumeClaim:
          claimName: ml-models-pvc
      - name: analytics-data
        emptyDir:
          sizeLimit: 5Gi
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi

---
# Edge Gateway for remote site connectivity
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: edge-gateway
  namespace: electrical-estimation
  labels:
    app: edge-gateway
    tier: edge-connectivity
spec:
  selector:
    matchLabels:
      app: edge-gateway
  template:
    metadata:
      labels:
        app: edge-gateway
        tier: edge-connectivity
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8085"
    spec:
      serviceAccountName: electrical-edge-service
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
      - effect: NoSchedule
        operator: Exists
      containers:
      - name: edge-gateway
        image: gcr.io/PROJECT_ID/edge-gateway:latest
        ports:
        - name: http
          containerPort: 8085
          hostPort: 8085
        - name: vpn
          containerPort: 1194
          hostPort: 1194
          protocol: UDP
        - name: tunnel
          containerPort: 4789
          hostPort: 4789
          protocol: UDP
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: ENABLE_VPN_SERVER
          value: "true"
        - name: ENABLE_TUNNEL_MODE
          value: "true"
        - name: BANDWIDTH_LIMIT
          value: "100Mbps"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        securityContext:
          privileged: true
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
        volumeMounts:
        - name: gateway-config
          mountPath: /app/config
        - name: vpn-certs
          mountPath: /app/vpn/certs
          readOnly: true
        - name: dev-net-tun
          mountPath: /dev/net/tun
      volumes:
      - name: gateway-config
        configMap:
          name: edge-gateway-config
      - name: vpn-certs
        secret:
          secretName: edge-vpn-certificates
      - name: dev-net-tun
        hostPath:
          path: /dev/net/tun

---
# Services for all edge components
apiVersion: v1
kind: Service
