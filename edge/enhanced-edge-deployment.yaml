  selector:
    app: edge-data-sync
  ports:
  - name: http
    port: 80
    targetPort: 8082
  - name: grpc
    port: 9092
    targetPort: 9092
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: remote-site-manager
  namespace: electrical-estimation
spec:
  selector:
    app: remote-site-manager
  ports:
  - name: http
    port: 80
    targetPort: 8083
  - name: ssh
    port: 2222
    targetPort: 2222
  type: LoadBalancer

---
apiVersion: v1
kind: Service
metadata:
  name: edge-analytics-engine
  namespace: electrical-estimation
spec:
  selector:
    app: edge-analytics-engine
  ports:
  - name: http
    port: 80
    targetPort: 8084
  - name: grpc
    port: 9094
    targetPort: 9094
  type: ClusterIP

---
# Persistent Volume Claims
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mqtt-data-pvc
  namespace: electrical-estimation
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: fast-ssd

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sync-buffer-pvc
  namespace: electrical-estimation
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: fast-ssd

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-models-pvc
  namespace: electrical-estimation
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: fast-ssd

---
# ConfigMaps for edge services
apiVersion: v1
kind: ConfigMap
metadata:
  name: mqtt-broker-config
  namespace: electrical-estimation
data:
  mosquitto.conf: |
    # MQTT Broker Configuration for Edge IoT Devices
    listener 1883
    protocol mqtt
    allow_anonymous false
    password_file /mosquitto/config/passwd
    
    listener 8883
    protocol mqtt
    cafile /mosquitto/certs/ca.crt
    certfile /mosquitto/certs/server.crt
    keyfile /mosquitto/certs/server.key
    require_certificate true
    
    listener 9001
    protocol websockets
    
    # Logging
    log_dest file /mosquitto/log/mosquitto.log
    log_type error
    log_type warning
    log_type notice
    log_type information
    
    # Persistence
    persistence true
    persistence_location /mosquitto/data/
    
    # Security
    max_connections 1000
    max_keepalive 300
    
    # Performance
    message_size_limit 268435456
    max_inflight_messages 20
    max_queued_messages 1000

  passwd: |
    # MQTT users (passwords are hashed)
    edge-device:$6$rounds=901$edge-hash$encrypted-password-hash
    iot-sensor:$6$rounds=901$sensor-hash$encrypted-password-hash

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-gateway-config
  namespace: electrical-estimation
data:
  gateway.conf: |
    # Edge Gateway Configuration
    server_mode = true
    listen_port = 1194
    protocol = udp
    dev = tun
    topology = subnet
    
    # Network configuration
    server = 10.8.0.0 255.255.255.0
    ifconfig-pool-persist ipp.txt
    
    # Routing
    push "route 10.0.0.0 255.0.0.0"
    push "route 172.16.0.0 255.240.0.0"
    push "route 192.168.0.0 255.255.0.0"
    
    # Security
    ca = /app/vpn/certs/ca.crt
    cert = /app/vpn/certs/server.crt
    key = /app/vpn/certs/server.key
    dh = /app/vpn/certs/dh.pem
    
    # Performance
    keepalive = 10 120
    comp-lzo = adaptive
    persist-key = true
    persist-tun = true
    
    # Logging
    status = /var/log/openvpn-status.log
    log-append = /var/log/openvpn.log
    verb = 3

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-site-templates
  namespace: electrical-estimation
data:
  construction-site.yaml: |
    # Construction Site Edge Configuration Template
    site_type: construction
    edge_capabilities:
      - real_time_load_calculation
      - safety_monitoring
      - equipment_tracking
      - progress_reporting
    
    hardware_requirements:
      min_cpu: "4 cores"
      min_memory: "8GB"
      min_storage: "100GB"
      gpu_required: true
      network_bandwidth: "100Mbps"
    
    sensors:
      - type: power_meter
        protocol: modbus
        polling_interval: "1s"
      - type: safety_camera
        protocol: rtsp
        resolution: "1080p"
      - type: environmental
        protocol: mqtt
        metrics: ["temperature", "humidity", "dust"]
    
    processing_config:
      max_latency_ms: 10
      priority: high
      enable_offline_mode: true
      sync_interval: "30s"

  design-office.yaml: |
    # Design Office Edge Configuration Template
    site_type: design_office
    edge_capabilities:
      - advanced_calculations
      - cad_integration
      - collaboration_tools
      - version_control
    
    hardware_requirements:
      min_cpu: "8 cores"
      min_memory: "32GB"
      min_storage: "500GB"
      gpu_required: true
      network_bandwidth: "1Gbps"
    
    software_stack:
      - autocad_plugin
      - revit_plugin
      - calculation_engine
      - version_control_client
    
    processing_config:
      max_latency_ms: 5
      priority: high
      enable_collaboration: true
      auto_backup: true

  mobile-inspector.yaml: |
    # Mobile Inspector Edge Configuration Template
    site_type: mobile_unit
    edge_capabilities:
      - code_compliance_check
      - photo_analysis
      - report_generation
      - offline_operation
    
    hardware_requirements:
      min_cpu: "2 cores"
      min_memory: "4GB"
      min_storage: "64GB"
      gpu_required: false
      battery_life: "8 hours"
    
    mobile_features:
      - gps_tracking
      - photo_capture
      - barcode_scanning
      - signature_capture
      - offline_sync
    
    processing_config:
      max_latency_ms: 50
      priority: normal
      offline_buffer_size: 1000
      sync_when_online: true

---
# Network Policies for Edge Components
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge-components-network-policy
  namespace: electrical-estimation
spec:
  podSelector:
    matchLabels:
      tier: edge-management
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow inter-edge communication
  - from:
    - podSelector:
        matchExpressions:
        - key: tier
          operator: In
          values: ["edge-management", "edge-analytics", "iot-communication"]
  # Allow from ingress controllers
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
  # Allow monitoring
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
  egress:
  # Allow DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
  # Allow HTTPS for cloud sync
  - to: []
    ports:
    - protocol: TCP
      port: 443
  # Allow database connections
  - to: []
    ports:
    - protocol: TCP
      port: 5432
  # Allow inter-edge communication
  - to:
    - podSelector:
        matchExpressions:
        - key: tier
          operator: In
          values: ["edge-management", "edge-analytics", "iot-communication"]

---
# ServiceMonitors for edge components
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: edge-components-metrics
  namespace: electrical-estimation
spec:
  selector:
    matchExpressions:
    - key: tier
      operator: In
      values: ["edge-management", "edge-analytics", "iot-communication"]
  endpoints:
  - port: metrics
    interval: 15s
    path: /metrics

---
# PrometheusRule for edge monitoring alerts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: edge-computing-alerts
  namespace: electrical-estimation
spec:
  groups:
  - name: edge-computing.rules
    rules:
    - alert: EdgeDeviceOffline
      expr: up{job=~"edge-.*"} == 0
      for: 2m
      labels:
        severity: warning
        component: edge-device
      annotations:
        summary: "Edge device is offline"
        description: "Edge device {{ $labels.instance }} has been offline for more than 2 minutes"
    
    - alert: EdgeHighLatency
      expr: edge_processing_latency_ms > 10
      for: 1m
      labels:
        severity: critical
        component: edge-processing
      annotations:
        summary: "Edge processing latency too high"
        description: "Edge processing latency is {{ $value }}ms, exceeding 10ms threshold"
    
    - alert: EdgeDataSyncFailing
      expr: increase(edge_sync_failures_total[5m]) > 5
      for: 2m
      labels:
        severity: warning
        component: edge-sync
      annotations:
        summary: "Edge data synchronization failing"
        description: "{{ $value }} sync failures in the last 5 minutes"
    
    - alert: EdgeStorageFull
      expr: edge_storage_usage_percent > 90
      for: 5m
      labels:
        severity: critical
        component: edge-storage
      annotations:
        summary: "Edge storage nearly full"
        description: "Edge storage usage is {{ $value }}%"