# Google Cloud Build Configuration for Electrical Estimation System
# This builds and deploys the entire system using Cloud Build

steps:
# Step 1: Build electrical calculator container
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build', 
    '-t', 'gcr.io/$PROJECT_ID/electrical-calculator:latest',
    '-f', 'plugins/electrical-calculator/Dockerfile',
    'plugins/electrical-calculator'
  ]
  id: 'build-electrical-calculator'

# Step 2: Push electrical calculator image
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/electrical-calculator:latest']
  id: 'push-electrical-calculator'
  waitFor: ['build-electrical-calculator']

# Step 3: Build material database service
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build',
    '-t', 'gcr.io/$PROJECT_ID/material-database:latest', 
    '-f', 'plugins/material-database/Dockerfile',
    'plugins/material-database'
  ]
  id: 'build-material-database'

# Step 4: Push material database image  
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/material-database:latest']
  id: 'push-material-database'
  waitFor: ['build-material-database']

# Step 5: Build N8N with custom electrical nodes
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build',
    '-t', 'gcr.io/$PROJECT_ID/n8n-electrical:latest',
    '-f', 'n8n/Dockerfile',
    'n8n'
  ]
  id: 'build-n8n-electrical'

# Step 6: Push N8N image
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/n8n-electrical:latest']
  id: 'push-n8n-electrical'
  waitFor: ['build-n8n-electrical']

# Step 7: Deploy Terraform infrastructure
- name: 'hashicorp/terraform:1.5.7'
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    cd gcp/terraform/environments/dev
    terraform init
    terraform plan -var-file=terraform.tfvars -out=tfplan
    terraform apply -auto-approve tfplan
  env:
  - 'TF_VAR_project_id=$PROJECT_ID'
  - 'TF_VAR_db_password=$$DB_PASSWORD'
  - 'TF_VAR_n8n_auth_password=$$N8N_PASSWORD'
  - 'TF_VAR_n8n_encryption_key=$$N8N_ENCRYPTION_KEY'
  secretEnv: ['DB_PASSWORD', 'N8N_PASSWORD', 'N8N_ENCRYPTION_KEY']
  id: 'deploy-infrastructure'

# Step 8: Deploy to GKE cluster
- name: 'gcr.io/cloud-builders/gke-deploy'
  args:
  - run
  - --filename=kubernetes/
  - --cluster=electrical-estimation-dev
  - --location=us-central1
  - --namespace=electrical-estimation
  id: 'deploy-to-gke'
  waitFor: ['deploy-infrastructure', 'push-electrical-calculator', 'push-material-database', 'push-n8n-electrical']

# Step 9: Run integration tests
- name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    # Get cluster credentials
    gcloud container clusters get-credentials electrical-estimation-dev --region=us-central1
    
    # Wait for deployments to be ready
    kubectl wait --for=condition=available --timeout=300s deployment/electrical-calculator -n electrical-estimation
    
    # Run health checks
    kubectl get pods -n electrical-estimation
    
    # Test electrical calculator service
    kubectl run test-pod --image=curlimages/curl --rm -i --restart=Never -- \
      curl -X POST http://electrical-calculator.electrical-estimation/api/calculate/load \
      -H "Content-Type: application/json" \
      -d '{"area_sqft": 2000, "building_type": "residential", "voltage_system": "single_phase_240v"}'
  id: 'integration-tests'
  waitFor: ['deploy-to-gke']

# Configure available secrets
availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/db-password/versions/latest
    env: 'DB_PASSWORD'
  - versionName: projects/$PROJECT_ID/secrets/n8n-password/versions/latest  
    env: 'N8N_PASSWORD'
  - versionName: projects/$PROJECT_ID/secrets/n8n-encryption-key/versions/latest
    env: 'N8N_ENCRYPTION_KEY'

# Build options
options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

# Build timeout
timeout: '3600s'  # 1 hour timeout

# Substitute build variables
substitutions:
  _ENVIRONMENT: 'dev'
  _REGION: 'us-central1'
  
images:
- 'gcr.io/$PROJECT_ID/electrical-calculator:latest'
- 'gcr.io/$PROJECT_ID/material-database:latest'  
- 'gcr.io/$PROJECT_ID/n8n-electrical:latest'