apiVersion: apps/v1
kind: Deployment
metadata:
  name: electrical-estimation-agents
spec:
  replicas: 50
  selector:
    matchLabels:
      app: estimation-agent
  template:
    spec:
      containers:
      - name: agent
        image: electrical-estimation:v2.1.0
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        env:
        - name: AGENT_TYPE
          value: "blueprint-analysis"
