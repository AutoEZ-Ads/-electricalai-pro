name: Deploy ElectricalAI Pro Monday App

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  NODE_VERSION: '18'
  REACT_APP_ENVIRONMENT: production

jobs:
  # Test job - runs on all events
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [16, 18, 20]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run linting
        run: npm run lint
        
      - name: Run unit tests
        run: npm test -- --coverage --watchAll=false
        env:
          CI: true
          
      - name: Run integration tests
        run: npm run test:integration
        env:
          REACT_APP_MONDAY_CLIENT_ID: ${{ secrets.TEST_MONDAY_CLIENT_ID }}
          REACT_APP_N8N_WEBHOOK_BASE: http://localhost:5678
          REACT_APP_ELECTRICALAI_API_KEY: test-key
          
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          
  # Build job - runs on all events
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build application
        run: npm run build
        env:
          REACT_APP_MONDAY_CLIENT_ID: ${{ secrets.MONDAY_CLIENT_ID }}
          REACT_APP_N8N_WEBHOOK_BASE: ${{ secrets.N8N_WEBHOOK_BASE }}
          REACT_APP_ELECTRICALAI_API_KEY: ${{ secrets.ELECTRICALAI_API_KEY }}
          REACT_APP_ENVIRONMENT: production
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-files
          path: build/
          retention-days: 7
          
      - name: Analyze bundle size
        run: |
          npm install -g bundlemon
          bundlemon
        env:
          BUNDLEMON_PROJECT_ID: ${{ secrets.BUNDLEMON_PROJECT_ID }}
          
  # Security scan job
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Run npm audit
        run: npm audit --audit-level high
        
      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
          
      - name: Upload Snyk results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: snyk.sarif
          
  # E2E tests job
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-files
          path: build/
          
      - name: Start application
        run: |
          npm run serve &
          sleep 10
        env:
          PORT: 3000
          
      - name: Run E2E tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          
      - name: Upload E2E test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          
  # Deploy to staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-files
          path: build/
          
      - name: Deploy to Render (Staging)
        uses: render-deploy/github-action@v1.0.0
        with:
          service-id: ${{ secrets.RENDER_STAGING_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
          
      - name: Wait for deployment
        run: sleep 60
        
      - name: Run staging smoke tests
        run: |
          curl -f ${{ secrets.STAGING_URL }}/health
          curl -f ${{ secrets.STAGING_URL }}/api/health
        
      - name: Notify staging deployment
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: 'ElectricalAI Pro staging deployment completed'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          
  # Deploy to production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, security, e2e]
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-files
          path: build/
          
      - name: Install dependencies for deployment
        run: npm ci --only=dev
        
      - name: Run deployment script
        run: chmod +x scripts/deploy.sh && ./scripts/deploy.sh production
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_APP_ID: ${{ secrets.MONDAY_APP_ID }}
          REACT_APP_MONDAY_CLIENT_ID: ${{ secrets.MONDAY_CLIENT_ID }}
          REACT_APP_N8N_WEBHOOK_BASE: ${{ secrets.N8N_WEBHOOK_BASE }}
          REACT_APP_ELECTRICALAI_API_KEY: ${{ secrets.ELECTRICALAI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          
      - name: Update Monday.com app version
        run: |
          curl -X PUT "https://api.monday.com/v2/apps/${{ secrets.MONDAY_APP_ID }}" \
            -H "Authorization: Bearer ${{ secrets.MONDAY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"version": "${{ github.sha }}"}'
            
      - name: Create deployment record
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ github.token }}
          environment: production
          deployment-status: success
          
      - name: Notify production deployment
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: |
            🚀 ElectricalAI Pro production deployment completed!
            
            📋 Details:
            • Version: ${{ github.sha }}
            • Environment: Production
            • URL: ${{ secrets.PRODUCTION_URL }}
            • Commit: ${{ github.event.head_commit.message }}
            
            🔗 Links:
            • [App URL](${{ secrets.PRODUCTION_URL }})
            • [Monday.com Marketplace](https://monday.com/marketplace/apps/electricalai-pro)
            • [Documentation](https://docs.electricalai.pro/monday-app)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          
  # Marketplace submission job
  marketplace-submission:
    name: Prepare Marketplace Submission
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.event_name == 'release'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Generate submission package
        run: |
          mkdir -p marketplace-submission
          cp mapps.json marketplace-submission/
          cp README.md marketplace-submission/
          cp -r assets/ marketplace-submission/ || echo "Assets directory not found"
          
          # Create submission metadata
          cat > marketplace-submission/submission.json << EOF
          {
            "version": "${{ github.event.release.tag_name }}",
            "release_notes": "${{ github.event.release.body }}",
            "submission_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "git_commit": "${{ github.sha }}",
            "production_url": "${{ secrets.PRODUCTION_URL }}",
            "documentation_url": "https://docs.electricalai.pro/monday-app",
            "support_email": "support@electricalai.pro"
          }
          EOF
          
      - name: Upload submission package
        uses: actions/upload-artifact@v3
        with:
          name: marketplace-submission-${{ github.event.release.tag_name }}
          path: marketplace-submission/
          retention-days: 30
          
      - name: Create GitHub release assets
        uses: softprops/action-gh-release@v1
        with:
          files: marketplace-submission/*
          body: |
            ## ElectricalAI Pro Monday.com App Release ${{ github.event.release.tag_name }}
            
            This release is ready for Monday.com marketplace submission.
            
            ### 🚀 Deployment
            - Production URL: ${{ secrets.PRODUCTION_URL }}
            - Commit: ${{ github.sha }}
            
            ### 📦 Package Contents
            - App manifest (mapps.json)
            - Documentation (README.md)
            - Assets and screenshots
            - Submission metadata
            
            ### 🔗 Links
            - [Live App](${{ secrets.PRODUCTION_URL }})
            - [Documentation](https://docs.electricalai.pro/monday-app)
            - [Support](mailto:support@electricalai.pro)
            
  # Post-deployment monitoring
  post-deployment-monitoring:
    name: Post-Deployment Monitoring
    runs-on: ubuntu-latest
    needs: deploy-production
    if: always() && needs.deploy-production.result == 'success'
    
    steps:
      - name: Wait for application warmup
        run: sleep 120
        
      - name: Health check monitoring
        run: |
          for i in {1..5}; do
            echo "Health check attempt $i/5"
            if curl -f "${{ secrets.PRODUCTION_URL }}/health"; then
              echo "✅ Health check passed"
              break
            else
              echo "❌ Health check failed"
              if [ $i -eq 5 ]; then
                exit 1
              fi
              sleep 30
            fi
          done
          
      - name: Performance monitoring
        run: |
          # Test page load time
          load_time=$(curl -o /dev/null -s -w "%{time_total}" "${{ secrets.PRODUCTION_URL }}")
          echo "Page load time: ${load_time}s"
          
          # Test API response time
          api_time=$(curl -o /dev/null -s -w "%{time_total}" "${{ secrets.PRODUCTION_URL }}/api/health")
          echo "API response time: ${api_time}s"
          
          # Alert if performance degrades
          if [ $(echo "$load_time > 3.0" | bc) -eq 1 ]; then
            echo "⚠️ Page load time exceeds 3 seconds: ${load_time}s"
            curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d '{"text": "⚠️ ElectricalAI Pro performance alert: Page load time is '"${load_time}"'s"}'
          fi
          
      - name: Create monitoring dashboard entry
        run: |
          curl -X POST "https://api.electricalai.pro/monitoring/deployments" \
            -H "Authorization: Bearer ${{ secrets.MONITORING_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "deployment_id": "${{ github.sha }}",
              "version": "${{ github.event.release.tag_name || github.sha }}",
              "environment": "production",
              "status": "success",
              "url": "${{ secrets.PRODUCTION_URL }}",
              "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
            }' || echo "Monitoring API not available"