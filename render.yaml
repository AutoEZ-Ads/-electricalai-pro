services:
  # Main ElectricalAI Backend API
  - type: web
    name: electricalai-backend
    env: node
    region: oregon
    plan: standard
    buildCommand: cd webapp/backend && npm install && npm run build
    startCommand: cd webapp/backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: N8N_WEBHOOK_URL
        value: https://electricalai-n8n.onrender.com
      - key: MONDAY_API_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELECTRICALAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: electricalai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: electricalai-cache
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGIN
        value: https://electricalai-frontend.onrender.com,https://monday.com
      - key: WEBHOOK_SECRET
        generateValue: true

  # Frontend React Application
  - type: web
    name: electricalai-frontend
    env: static
    region: oregon
    plan: starter
    buildCommand: cd webapp/frontend && npm install && npm run build
    staticPublishPath: ./webapp/frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://electricalai-backend.onrender.com
      - key: REACT_APP_N8N_URL
        value: https://electricalai-n8n.onrender.com
      - key: REACT_APP_ENVIRONMENT
        value: production
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  # N8N Workflow Automation System
  - type: web
    name: electricalai-n8n
    env: docker
    dockerfilePath: ./n8n/Dockerfile.render
    dockerContext: ./n8n
    region: oregon
    plan: standard
    healthCheckPath: /healthz
    envVars:
      # Database Configuration
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-postgres
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: n8n-postgres
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-postgres
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-postgres
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-postgres
          property: password
      
      # N8N Configuration
      - key: N8N_HOST
        value: electricalai-n8n.onrender.com
      - key: N8N_PORT
        value: 5678
      - key: N8N_PROTOCOL
        value: https
      - key: NODE_ENV
        value: production
      - key: WEBHOOK_URL
        value: https://electricalai-n8n.onrender.com/
      
      # Authentication
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_BASIC_AUTH_USER
        value: admin
      - key: N8N_BASIC_AUTH_PASSWORD
        generateValue: true
      
      # Execution Settings
      - key: EXECUTIONS_PROCESS
        value: main
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "336"
      
      # Queue Configuration
      - key: EXECUTIONS_MODE
        value: queue
      - key: QUEUE_BULL_REDIS_HOST
        fromService:
          type: redis
          name: n8n-redis
          property: host
      - key: QUEUE_BULL_REDIS_PORT
        fromService:
          type: redis
          name: n8n-redis
          property: port
      
      # ElectricalAI Integration
      - key: ELECTRICALAI_API_URL
        value: https://electricalai-backend.onrender.com
      - key: ELECTRICALAI_API_KEY
        sync: false
      
      # External API Keys
      - key: OPENAI_API_KEY
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      
      # Performance Settings
      - key: N8N_METRICS
        value: "true"
      - key: N8N_METRICS_PREFIX
        value: n8n_
      
      # Security
      - key: N8N_ENCRYPTION_KEY
        generateValue: true

  # N8N Worker Service for Queue Processing
  - type: worker
    name: electricalai-n8n-worker
    env: docker
    dockerfilePath: ./n8n/Dockerfile.render
    dockerContext: ./n8n
    region: oregon
    plan: starter
    envVars:
      # Database Configuration (same as main service)
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-postgres
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: n8n-postgres
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-postgres
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-postgres
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-postgres
          property: password
      
      # Worker Configuration
      - key: EXECUTIONS_MODE
        value: queue
      - key: EXECUTIONS_PROCESS
        value: worker
      
      # Queue Configuration
      - key: QUEUE_BULL_REDIS_HOST
        fromService:
          type: redis
          name: n8n-redis
          property: host
      - key: QUEUE_BULL_REDIS_PORT
        fromService:
          type: redis
          name: n8n-redis
          property: port
      
      # ElectricalAI Integration
      - key: ELECTRICALAI_API_URL
        value: https://electricalai-backend.onrender.com
      - key: ELECTRICALAI_API_KEY
        sync: false
      
      # External API Keys
      - key: OPENAI_API_KEY
        sync: false
    
    startCommand: n8n worker

  # Monday.com App Hosting
  - type: web
    name: electricalai-monday-app
    env: static
    region: oregon
    plan: starter
    buildCommand: cd monday-app && npm install && npm run build
    staticPublishPath: ./monday-app/build
    envVars:
      - key: REACT_APP_N8N_WEBHOOK_BASE
        value: https://electricalai-n8n.onrender.com
      - key: REACT_APP_ELECTRICALAI_API_KEY
        sync: false
      - key: REACT_APP_MONDAY_API_TOKEN
        sync: false
      - key: REACT_APP_ENVIRONMENT
        value: production
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  # Redis Cache for Backend and N8N
  - type: redis
    name: electricalai-cache
    region: oregon
    plan: starter
    maxmemoryPolicy: allkeys-lru

  # Redis for N8N Queue Management
  - type: redis
    name: n8n-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: allkeys-lru

databases:
  # Main ElectricalAI Application Database
  - name: electricalai-db
    databaseName: electricalai_prod
    user: electricalai_user
    region: oregon
    plan: starter
    postgresMajorVersion: 14

  # N8N Workflow Database
  - name: n8n-postgres
    databaseName: n8n_db
    user: n8n_user
    region: oregon
    plan: starter
    postgresMajorVersion: 14
EOF < /dev/null