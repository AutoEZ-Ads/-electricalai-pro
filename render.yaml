# Render.com Blueprint for ElectricalAI Pro Platform
# Complete production deployment configuration

services:
  # ================================
  # N8N WORKFLOW AUTOMATION
  # ================================
  - type: web
    name: electricalai-n8n
    env: node
    buildCommand: npm install
    startCommand: npm start
    plan: starter
    branch: main
    rootDir: n8n
    healthCheckPath: /healthz
    envVars:
      # N8N Core Configuration
      - key: N8N_HOST
        value: 0.0.0.0
      - key: N8N_PORT
        value: 10000
      - key: N8N_PROTOCOL
        value: https
      - key: NODE_ENV
        value: production
      - key: WEBHOOK_URL
        value: https://electricalai-n8n.onrender.com/
      
      # Authentication
      - key: N8N_BASIC_AUTH_ACTIVE
        value: true
      - key: N8N_BASIC_AUTH_USER
        value: admin
      - key: N8N_BASIC_AUTH_PASSWORD
        generateValue: true
      
      # Database Configuration
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: electricalai-n8n-db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: electricalai-n8n-db
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: electricalai-n8n-db
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: electricalai-n8n-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: electricalai-n8n-db
          property: password
      
      # Queue Configuration
      - key: EXECUTIONS_MODE
        value: queue
      - key: QUEUE_BULL_REDIS_HOST
        fromService:
          name: electricalai-redis
          type: redis
          property: host
      - key: QUEUE_BULL_REDIS_PORT
        fromService:
          name: electricalai-redis
          type: redis
          property: port
      
      # Security Settings
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: N8N_SECURE_COOKIE
        value: true
      - key: N8N_USER_MANAGEMENT_DISABLED
        value: false
      
      # ElectricalAI Pro Integration
      - key: ELECTRICALAI_API_URL
        value: https://electricalai-api.onrender.com
      - key: ELECTRICALAI_API_KEY
        sync: false
      
      # External Services
      - key: OPENAI_API_KEY
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      
      # Email Configuration
      - key: N8N_EMAIL_MODE
        value: smtp
      - key: N8N_SMTP_HOST
        sync: false
      - key: N8N_SMTP_PORT
        value: 587
      - key: N8N_SMTP_USER
        sync: false
      - key: N8N_SMTP_PASS
        sync: false
      - key: N8N_SMTP_SENDER
        value: ElectricalAI Pro <noreply@electricalai.pro>
      
      # Performance Settings
      - key: N8N_LOG_LEVEL
        value: info
      - key: N8N_METRICS
        value: true
      - key: N8N_PAYLOAD_SIZE_MAX
        value: 16

  # ================================
  # N8N WORKER INSTANCES
  # ================================
  - type: worker
    name: electricalai-n8n-worker
    env: node
    buildCommand: npm install
    startCommand: npm run start:worker
    plan: starter
    branch: main
    rootDir: n8n
    scaling:
      minInstances: 1
      maxInstances: 3
    envVars:
      # Worker Configuration
      - key: EXECUTIONS_PROCESS
        value: worker
      - key: EXECUTIONS_MODE
        value: queue
      
      # Database Configuration (same as main service)
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: electricalai-n8n-db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: electricalai-n8n-db
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: electricalai-n8n-db
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: electricalai-n8n-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: electricalai-n8n-db
          property: password
      
      # Queue Configuration
      - key: QUEUE_BULL_REDIS_HOST
        fromService:
          name: electricalai-redis
          type: redis
          property: host
      - key: QUEUE_BULL_REDIS_PORT
        fromService:
          name: electricalai-redis
          type: redis
          property: port
      
      # Security Settings
      - key: N8N_ENCRYPTION_KEY
        sync: false
      
      # External Services
      - key: OPENAI_API_KEY
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      - key: ELECTRICALAI_API_KEY
        sync: false

  # ================================
  # ELECTRICALAI PRO API
  # ================================
  - type: web
    name: electricalai-api
    env: node
    buildCommand: npm install
    startCommand: npm start
    plan: starter
    branch: main
    rootDir: webapp/backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      
      # Database Configuration
      - key: DATABASE_URL
        fromDatabase:
          name: electricalai-main-db
          property: connectionString
      
      # N8N Integration
      - key: N8N_WEBHOOK_URL
        value: https://electricalai-n8n.onrender.com
      - key: N8N_WEBHOOK_SECRET
        generateValue: true
      
      # External APIs
      - key: OPENAI_API_KEY
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      
      # JWT and Security
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      
      # Email Configuration
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

  # ================================
  # ELECTRICALAI PRO FRONTEND
  # ================================
  - type: web
    name: electricalai-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    plan: starter
    branch: main
    rootDir: webapp/frontend
    envVars:
      - key: REACT_APP_API_URL
        value: https://electricalai-api.onrender.com
      - key: REACT_APP_N8N_URL
        value: https://electricalai-n8n.onrender.com
      - key: NODE_ENV
        value: production
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

databases:
  # ================================
  # N8N DATABASE
  # ================================
  - name: electricalai-n8n-db
    databaseName: n8n_production
    user: n8n_user
    plan: starter
    
  # ================================
  # MAIN APPLICATION DATABASE
  # ================================
  - name: electricalai-main-db
    databaseName: electricalai_production
    user: electricalai_user
    plan: starter

# ================================
# REDIS SERVICES
# ================================
services:
  - type: redis
    name: electricalai-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru

# ================================
# CRON JOBS
# ================================
  - type: cron
    name: electricalai-cleanup
    schedule: "0 2 * * *"  # Daily at 2 AM
    buildCommand: npm install
    startCommand: node scripts/cleanup.js
    plan: starter
    branch: main
    rootDir: webapp/backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: electricalai-main-db
          property: connectionString

  - type: cron
    name: electricalai-metrics
    schedule: "*/15 * * * *"  # Every 15 minutes
    buildCommand: npm install
    startCommand: node scripts/collect-metrics.js
    plan: starter
    branch: main
    rootDir: webapp/backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: electricalai-main-db
          property: connectionString
      - key: N8N_WEBHOOK_URL
        value: https://electricalai-n8n.onrender.com